[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "Deterministic log analysis engine, exposed as an MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cristian Sequeira" }]
keywords = ["logs", "observability", "mcp", "ai-agents", "incident-response"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
]

# El servidor MCP **no** depende del dashboard. Es deliberado: el motor y la
# frontera MCP tienen que poder instalarse en una máquina sin Streamlit, sin
# pandas y sin Plotly. Lo que se paga en comodidad se gana en que el servidor
# arranque en 200 ms y en que las dependencias del motor sean auditables.
dependencies = [
    "mcp>=2.3,<3",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
# El watcher funciona sin watchdog (cae a polling); con él, usa inotify.
ingest = ["watchdog>=6.0.0"]
# Sólo el dashboard. `pandas==2.3.3` es el primer release con wheel cp314.
dashboard = [
    "pandas==2.3.3",
    "plotly==6.0.1",
    "streamlit==1.42.2",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.17.2",
    "mypy==2.4.0",
]
# La capa agentic es opcional: sin el extra, el planner heurístico y el
# sintetizador determinista funcionan igual. El import de `anthropic` es
# perezoso justamente para que los tests no lo necesiten.
agent = ["anthropic>=0.40"]

[project.scripts]
loglens = "app.mcp.__main__:main"
loglens-mcp = "app.mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/criseen7/loglens"
Issues = "https://github.com/criseen7/loglens/issues"

[tool.setuptools.packages.find]
include = ["app*"]

# --- Ruff ------------------------------------------------------------------
# Se selecciona poco y se selecciona en serio: E/F (errores reales), I (orden
# de imports, que evita diffs de ruido), B (bugs sutiles de la stdlib) y UP
# (sintaxis moderna). Un linter con 300 reglas que todo el mundo ignora no
# protege de nada.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

# --- Mypy ------------------------------------------------------------------
# Acotado a propósito a la capa nueva. El motor existente (207 tests) no está
# tipado y convertirlo entero sería un refactor que no aporta nada al objetivo;
# la frontera y el bucle sí se tipan porque son lo que se publica.
[tool.mypy]
python_version = "3.14"
files = [
  "app/mcp",
  "app/agent",
  "app/analysis/windows.py",
  "app/analysis/blast.py",
  "app/timeutil.py",
  "evals",
]
# `follow_imports = "silent"` deja que mypy use los tipos de los módulos
# antiguos (repository, alerts, UI) sin reportar sus errores: el objetivo es
# tipar la capa nueva, no reescribir el motor que ya funciona.
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
