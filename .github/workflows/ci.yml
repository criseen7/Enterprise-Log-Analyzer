name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Un analyzer de logs tiene que ser reproducible: si el locale cambia el
  # formato de fecha o el orden de los mensajes, los golden snapshots fallan en
  # una máquina y pasan en otra.
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  types:
    name: mypy (app/mcp, app/agent, motor extendido)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: mypy

  purity:
    name: guard de pureza del motor
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      # Este job no instala `mcp` ni ningún SDK de LLM a propósito: el motor
      # tiene que poder importarse y testearse sin ellos. Si el guard pasara
      # sólo porque las dependencias están instaladas, no probaría nada.
      - run: pip install PyYAML==6.0.3
      - name: el motor no importa LLM ni transporte
        run: python -m unittest tests.test_engine_purity -v

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # El badge promete 3.11+; probar sólo 3.14 convertía esa promesa en
        # una suposición. 3.14 es el runtime de despliegue.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: bytecode
        run: python -m compileall -q app tools tests
      - name: golden snapshots
        run: python -m tests.regenerate_golden --check
      - name: unittest
        run: python -m unittest discover -s tests -t . -v

  evals:
    name: evals (dataset + smoke)
    runs-on: ubuntu-26.04
    # La clave se inyecta a nivel de job para que los pasos puedan decidir con
    # `if: env...`, cosa que `secrets` no permite. Sin clave, el smoke con
    # modelo imprime SKIPPED; el determinista corre siempre y es un gate real.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-evals.txt
      - name: el dataset versionado es reproducible
        run: python -m evals.dataset.build --verify
      - name: smoke determinista (A0, sin LLM)
        run: |
          python -m evals.run --subset smoke --plan heuristic --tag ci-a0 \
            --fail-under root_cause_accuracy=0.6 \
            --fail-under hallucination_rate=0.15
      - name: smoke con modelo
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          python -m evals.run --subset smoke --tag ci-model \
            --fail-under root_cause_accuracy=0.6 \
            --fail-under hallucination_rate=0.15
      - name: smoke con modelo (omitido)
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::notice::SKIPPED: no hay ANTHROPIC_API_KEY; no se ejecuta el smoke con modelo."
          echo "El smoke determinista anterior sí se ejecutó y es el gate de este job."

  docker:
    name: docker build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: loglens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: la imagen arranca y migra
        # Un contenedor único: migrar y comprobar la salud contra la misma DB,
        # no contra una filesystem efímera distinta en cada `docker run`.
        run: |
          docker run --rm loglens:ci sh -c \
            "python -m app.db.migrations && python -m app.ingest --healthy"

  compose:
    name: docker compose (arranque, HITL y persistencia)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: primer arranque
        run: docker compose up -d --wait
      - name: el esquema está al día
        run: docker compose exec -T analyzer python -m app.ingest --healthy
      - name: el secreto HITL se comparte dentro del contenedor
        run: |
          docker compose exec -T mcp python -c \
            "from app.mcp.hitl import load_secret; assert len(load_secret()) >= 32"
      - name: la base sobrevive a down/up
        # `down` sin -v conserva los volúmenes con nombre: la DB migrada y el
        # secreto tienen que seguir ahí después de recrear los contenedores.
        run: |
          docker compose down
          docker compose up -d --wait
          docker compose exec -T analyzer python -m app.ingest --healthy
      - name: el dashboard responde
        run: curl -fsS http://127.0.0.1:8501/_stcore/health
      - name: volcado si algo falla
        if: failure()
        run: docker compose logs --no-color
      - name: limpieza
        if: always()
        run: docker compose down
