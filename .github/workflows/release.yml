name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install pip==26.3 build==1.6.1 twine==7.0.0 -r requirements.txt -r requirements-dev.txt
      - name: verify dataset
        run: python -m evals.dataset.build --verify
      - name: build
        run: python -m build
      - name: check distributions
        run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  release:
    name: github release
    needs: build
    runs-on: ubuntu-26.04
    # Sólo este job publica: aquí se concede escritura, no al workflow entero.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/
      - name: extract changelog
        id: changelog
        run: |
          set -euo pipefail
          # El tag es dato del evento, nunca código. Git permite comillas y
          # punto y coma en un tag, así que se valida antes de usarlo y se pasa
          # al awk con -v (nunca interpolado dentro del programa).
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag inesperado: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "sin notas para $GITHUB_REF_NAME en CHANGELOG.md" >&2
            exit 1
          fi
          echo "notes=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
